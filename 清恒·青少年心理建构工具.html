<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5, minimum-scale=0.8">
  <title>清恒·青少年心理建构工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #ffffff; --bg-subtle: #fafafa; --surface: #ffffff;
      --line: #e5e7eb; --line-strong: #d1d5db; --text: #111827; --text-secondary: #374151; --muted: #6b7280;
      --danger: #dc2626; --danger-light: #fef2f2; --success: #16a34a; --success-light: #f0fdf4;
      --warning-light: #fffbeb; --radius-sm: 12px; --radius: 16px; --radius-lg: 20px; --transition: 0.2s ease;
    }

    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 96px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      color: var(--text);
      background: var(--bg-subtle);
      line-height: 1.7;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.3px; color: var(--text); margin-bottom: 0.5rem; }
    h2, h3 { font-weight: 650; color: var(--text); margin: 0.5rem 0 0.6rem; }
    p { margin: 0.4rem 0; color: var(--text-secondary); font-size: 0.94rem; }
    .muted { color: var(--muted); font-size: 0.82rem; }
    .step-title {
      font-size: 1.2rem; font-weight: 700; color: var(--text); padding-left: 14px;
      border-left: 4px solid var(--primary); background: transparent; border-radius: 0; margin-bottom: 0.5rem;
    }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 24px 28px 28px; margin: 20px 0; box-shadow: none; transition: border-color var(--transition);
    }
    .panel:hover { border-color: var(--line-strong); }
    textarea, .phrase-editor {
      width: 100%; font-family: inherit; font-size: 0.94rem; padding: 14px 16px;
      border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff;
      transition: border-color var(--transition); resize: vertical; color: var(--text); line-height: 1.6;
    }
    textarea:focus, .phrase-editor:focus-within {
      border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }
    textarea::placeholder { color: var(--muted); }
    .phrase-editor { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; padding: 14px 16px; min-height: 52px; background: #fff; }
    .token { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; background: var(--bg-subtle); border-radius: 40px; padding: 8px 16px; border: 1px solid var(--line); transition: border-color var(--transition); }
    .token:focus-within { border-color: var(--primary); }
    .fixed { color: var(--text-secondary); user-select: none; white-space: nowrap; font-weight: 500; font-size: 0.9rem; }
    .editable-mid { min-width: 4.5em; border-bottom: 2px dashed var(--line-strong); outline: none; padding: 2px 8px; color: var(--primary); font-weight: 550; transition: border-color var(--transition); border-radius: 4px; font-size: 0.94rem; display: inline-block; }
    .editable-mid:focus { border-bottom-color: var(--primary); background: rgba(37,99,235,0.03); }
    .editable-mid:empty::before { content: attr(data-placeholder); color: var(--muted); font-weight: 400; }
    button { background: #fff; border: 1px solid var(--line); padding: 10px 22px; border-radius: 999px; font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all var(--transition); color: var(--text); font-family: inherit; user-select: none; white-space: nowrap; }
    button:hover { background: var(--bg-subtle); border-color: var(--line-strong); }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn-secondary:hover { background: var(--bg-subtle); }
    .btn-danger { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
    .btn-danger:hover { background: var(--danger-light); }
    .btn-small { padding: 6px 16px; font-size: 0.78rem; }
    .hints, .bubbles { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
    .hint, .bubble, .tag { background: #fff; padding: 7px 15px; border-radius: 999px; font-size: 0.8rem; cursor: pointer; transition: all var(--transition); border: 1px solid var(--line); color: var(--text-secondary); font-weight: 500; }
    .hint:hover, .bubble:hover { background: var(--bg-subtle); border-color: var(--primary); color: var(--primary); }
    .tag.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 650; }
    .output-box, .report-box { background: var(--bg-subtle); border-radius: var(--radius-sm); padding: 16px 18px; border: 1px solid var(--line); white-space: pre-wrap; font-size: 0.88rem; margin: 12px 0; line-height: 1.7; color: var(--text-secondary); font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; }
    .success-box { background: var(--success-light); border: 1px solid #bbf7d0; border-left: 4px solid var(--success); padding: 14px 18px; border-radius: var(--radius-sm); color: #166534; margin: 12px 0; font-weight: 500; }
    .fault-box { background: var(--danger-light); border: 1px solid #fecaca; border-left: 4px solid var(--danger); padding: 14px 18px; border-radius: var(--radius-sm); color: #991b1b; font-weight: 500; }
    .reference-box { background: var(--bg-subtle); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 0.84rem; border: 1px solid var(--line); color: var(--text-secondary); margin: 12px 0; }
    .roadmap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 16px 0 10px; justify-content: space-between; }
    .milestone { text-align: center; cursor: default; color: var(--muted); min-width: 64px; font-size: 0.78rem; transition: var(--transition); padding: 4px; position: relative; }
    .milestone .icon { font-size: 1.6rem; display: block; margin-bottom: 4px; transition: var(--transition); }
    .milestone.current { color: var(--primary); font-weight: 700; }
    .milestone.done { color: var(--success); cursor: pointer; }
    .milestone.done:hover { color: #15803d; }
    .milestone.done::after { content: "✓"; position: absolute; top: -6px; right: -6px; background: var(--success); color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; line-height: 16px; font-weight: bold; }
    .connector { flex: 1; height: 2px; background: var(--line); border-radius: 2px; min-width: 20px; transition: var(--transition); }
    .connector.done { background: var(--success); }
    .tabs { display: flex; gap: 6px; margin: 16px 0 10px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    .tab { padding: 8px 16px; background: #fff; border-radius: 999px; cursor: pointer; font-size: 0.85rem; font-weight: 550; border: 1px solid var(--line); color: var(--text-secondary); transition: all var(--transition); white-space: nowrap; flex-shrink: 0; }
    .tab:hover { border-color: var(--primary); color: var(--primary); }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 18px; margin-bottom: 8px; cursor: pointer; transition: border-color var(--transition); }
    .card:hover { border-color: var(--line-strong); }
    .card-extra { display: none; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
    .card.expanded .card-extra { display: block; }
    .toast { position: fixed; bottom: 24px; right: 20px; background: var(--text); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 0.85rem; z-index: 1200; font-weight: 500; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity 0.2s ease, transform 0.2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
    .welcome-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .welcome-card .info { flex: 1; min-width: 200px; }
    .intensity-dial { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
    .dial-dot { width: 42px; height: 42px; border-radius: 50%; cursor: pointer; transition: all 0.15s ease; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: #fff; user-select: none; }
    .dial-dot:hover { transform: scale(1.08); }
    .dial-dot.selected { transform: scale(1.12); border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .dial-description { text-align: center; min-height: 36px; padding: 6px; font-size: 0.84rem; color: var(--muted); transition: all 0.2s ease; }

    /* 桌面端右侧固定调试日志栏 */
    .debug-sidebar {
      display: none;
    }
    .debug-sidebar-toggle {
      display: none;
    }

    /* 移动端齿轮触发器（桌面端隐藏） */
    .debug-trigger {
      position: fixed; bottom: 20px; right: 20px; z-index: 999; width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
      font-size: 1rem; cursor: pointer; transition: all var(--transition);
    }
    .debug-trigger.active { box-shadow: 0 0 0 4px rgba(245,158,11,0.35); }
    .debug-trigger:hover { border-color: var(--line-strong); }

    /* 移动端调试面板 */
    .debug-panel {
      position: fixed; bottom: 72px; right: 20px; z-index: 998; background: #fff; border-radius: var(--radius);
      border: 1px solid var(--line); padding: 18px 20px; width: 320px; max-height: 70vh; overflow-y: auto; display: none;
    }
    .debug-panel.visible { display: block; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
    .toggle-label { font-size: 0.85rem; color: var(--text); }
    .toggle-switch {
      width: 40px; height: 22px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer;
      transition: background 0.2s ease;
    }
    .toggle-switch.on { background: var(--primary); }
    .toggle-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; transition: transform 0.2s ease;
    }
    .toggle-switch.on::after { transform: translateX(18px); }
    .debug-status { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    /* 日志查看器 */
    .log-viewer { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .log-list {
      background: #1e293b; border-radius: 10px; padding: 10px; max-height: 280px; overflow-y: auto;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; font-size: 0.72rem; line-height: 1.6; color: #e2e8f0;
    }
    .log-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); white-space: pre-wrap; }
    .log-item .log-line { margin: 1px 0; }
    .log-item .log-module { color: #60a5fa; }
    .log-item .log-action { color: #fbbf24; }
    .log-item .log-highlight { color: #f87171; }
    .log-item .log-data { color: #94a3b8; }
    .log-item .log-indent1 { padding-left: 12px; }
    .log-item .log-indent2 { padding-left: 24px; }
    .log-viewer-actions { display: flex; gap: 8px; margin-top: 8px; }

    /* ============================================================
       桌面端布局（最小宽度 1024px）
       ============================================================ */
    @media (min-width: 1024px) {
      body {
        max-width: none;
        margin: 0;
        padding: 0;
        display: flex;
        min-height: 100vh;
      }
      .main-content {
        flex: 1;
        max-width: 820px;
        margin: 0 auto;
        padding: 32px 28px 96px;
      }
      /* 桌面端：隐藏移动端齿轮和面板 */
      .debug-trigger { display: none; }
      .debug-panel { display: none !important; }

      /* 桌面端：右侧固定日志栏 */
      .debug-sidebar {
        display: flex;
        flex-direction: column;
        width: 340px;
        min-width: 340px;
        height: 100vh;
        position: sticky;
        top: 0;
        background: #fff;
        border-left: 1px solid var(--line);
        padding: 20px 18px;
        overflow-y: auto;
      }
      .debug-sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .debug-sidebar-header h3 {
        margin: 0;
        font-size: 1rem;
        color: var(--text);
      }
      .debug-sidebar .log-viewer {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .debug-sidebar .log-list {
        flex: 1;
        max-height: none;
        min-height: 200px;
      }
    }

    /* 移动端 */
    @media (max-width: 600px) {
      body { padding: 16px 10px 72px; }
      h1 { font-size: 1.35rem; }
      .connector { display: none; }
      .roadmap { justify-content: space-around; }
      .milestone .icon { font-size: 1.3rem; }
      .panel { padding: 16px 16px 20px; border-radius: var(--radius); }
      .step-title { font-size: 1.1rem; }
      button { padding: 8px 16px; font-size: 0.82rem; }
      .phrase-editor { padding: 10px 12px; }
      .token { padding: 6px 12px; }
      .dial-dot { width: 46px; height: 46px; }
      .debug-panel { width: 280px; right: 10px; bottom: 68px; }
      .debug-trigger { right: 10px; bottom: 16px; }
    }
  </style>
</head>
<body>

<!-- 桌面端：主内容区 -->
<div class="main-content" id="mainContent">

<h1 id="mainTitle">清恒·青少年心理建构工具</h1>
<div id="welcomeCardContainer"></div>
<p id="mainSubtitle" style="margin-bottom:1.2rem;"></p>
<div id="faultDisplay" class="fault-box" style="display:none;" role="alert"></div>

<section id="scanModule" class="panel">
  <div class="step-title" id="scanTitle"></div>
  <p id="scanDesc"></p>
  <textarea id="userInput" rows="3" placeholder="" aria-label="描述你的困扰"></textarea>
  <div class="muted" style="margin-top:6px;"><label style="cursor:pointer;display:flex;align-items:center;gap:6px;"><input type="checkbox" id="singleCharSwitch"> 实验模式：单字匹配</label></div>
  <div class="nav"><button class="btn-primary" id="scanBtn">📡 记录故障现象</button></div>
  <div id="scanConfirm" style="display:none;">
    <h3 id="scanConfirmTitle">✏️ 确认和修改</h3>
    <p class="muted" id="scanConfirmDesc"></p>
    <div id="scanOutput" class="output-box"></div>
    <textarea id="editArea" rows="3" aria-label="编辑归纳结果"></textarea>
    <h4 style="margin-top:12px;">📊 情绪强度等级</h4>
    <p class="muted">请根据真实感受选择一个强度等级：</p>
    <div id="scanIntensityDial" class="intensity-dial"></div>
    <div id="scanDialDescription" class="dial-description"></div>
    <button class="btn-primary" id="confirmScanBtn" style="margin-top:8px;">确认并进入故障分型</button>
  </div>
  <div id="saveSuccess" class="success-box" style="display:none;"></div>
</section>

<section id="disassembleModule" class="panel" style="display:none;">
  <div class="step-title" id="disTitle"></div>
  <p id="disDesc"></p>
  <div id="dRoadmap" class="roadmap"></div>
  <div class="muted">💡 点击已完成步骤可返回修改</div>
  <div class="nav">
    <button class="btn-secondary" id="backToScanBtn">← 返回上一步</button>
    <button class="btn-secondary" id="resetDisBtn">🔄 重新拆解</button>
  </div>
  <div class="reference-box"><strong>📋 当前梳理：</strong><span id="referenceText"></span></div>
  <div id="dContent"></div>
  <div id="reportArea" style="display:none;">
    <div class="step-title">📋 分型报告</div>
    <div id="reportContent" class="report-box"></div>
    <textarea id="reportEdit" rows="6" aria-label="编辑分型报告"></textarea>
    <button class="btn-primary" id="confirmReportBtn">确认并进入下一步</button>
  </div>
  <div id="reportSuccess" class="success-box" style="display:none;"></div>
</section>

<section id="constructModule" class="panel" style="display:none;">
  <div class="step-title" id="conTitle"></div>
  <p id="conDesc"></p>
  <div id="cRoadmap" class="roadmap"></div>
  <div class="muted">💡 点击已完成步骤可返回修改</div>
  <div class="nav">
    <button class="btn-secondary" id="backToDisBtn">← 返回上一步</button>
    <button class="btn-secondary" id="resetConBtn">🔄 重置建构</button>
  </div>
  <div class="reference-box"><strong>📦 当前方案：</strong><span id="constructReferenceText"></span></div>
  <div id="cContent"></div>
  <div id="creportArea" style="display:none;">
    <div class="step-title">📋 我的改变方案</div>
    <div id="creportContent" class="report-box"></div>
    <textarea id="creportEdit" rows="6" aria-label="编辑改变方案"></textarea>
    <div class="nav">
      <button class="btn-primary" id="savePlanBtn">💾 保存方案</button>
      <button class="btn-secondary" id="editPlanBtn">✏️ 重新修改</button>
      <button class="btn-secondary" id="copyPlanBtn">📋 一键复制</button>
    </div>
  </div>
  <div id="creportSuccess" class="success-box" style="display:none;"></div>
</section>

<section id="anchorModule" class="panel" style="display:none;">
  <div class="step-title" id="anchorTitle"></div>
  <p id="anchorDesc"></p>
  <div class="tabs" role="tablist">
    <span class="tab active" data-tab="museum">📦 协议博物馆</span>
    <span class="tab" data-tab="gravity">🌌 引力图</span>
    <span class="tab" data-tab="review">📅 每周评审</span>
    <span class="tab" data-tab="stress">🔧 压力测试</span>
    <span class="tab" data-tab="report">📊 数据报告</span>
  </div>
  <div id="anchorPanel"></div>
</section>

</div><!-- /main-content -->

<!-- 桌面端：右侧固定日志栏 -->
<aside class="debug-sidebar" id="debugSidebar">
  <div class="debug-sidebar-header">
    <h3>🔍 调试工具</h3>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="toggle-label" style="font-size:0.78rem;">调试</span>
      <div class="toggle-switch" id="debugToggleDesktop"></div>
    </div>
  </div>
  <div class="debug-status" id="debugStatusDesktop" style="margin-bottom:8px;">当前状态：已关闭</div>
  <div class="log-viewer">
    <div class="log-list" id="logListDesktop"><div style="color:#64748b;text-align:center;padding:12px;">暂无日志</div></div>
    <div class="log-viewer-actions">
      <button class="btn-secondary btn-small" id="clearLogBtnDesktop">清空日志</button>
      <button class="btn-secondary btn-small" id="copyLogBtnDesktop">📋 复制全部</button>
    </div>
  </div>
</aside>

<!-- 移动端：齿轮触发器 -->
<div class="debug-trigger" id="debugTrigger" title="调试工具">⚙</div>
<!-- 移动端：弹出调试面板 -->
<div class="debug-panel" id="debugPanel">
  <div style="font-weight:600;font-size:0.9rem;margin-bottom:8px;">🔍 调试工具</div>
  <div class="toggle-row">
    <span class="toggle-label">调试模式</span>
    <div class="toggle-switch" id="debugToggle"></div>
  </div>
  <div class="debug-status" id="debugStatus">当前状态：已关闭</div>
  <div class="log-viewer">
    <div class="log-list" id="logList"><div style="color:#64748b;text-align:center;padding:12px;">暂无日志</div></div>
    <div class="log-viewer-actions">
      <button class="btn-secondary btn-small" id="clearLogBtn">清空日志</button>
      <button class="btn-secondary btn-small" id="copyLogBtn">📋 复制全部</button>
    </div>
  </div>
  <div style="text-align:right;margin-top:8px;"><button class="btn-secondary btn-small" id="debugCloseBtn">关闭面板</button></div>
</div>

<script>
(function(){
  'use strict';

  const CONFIG = {
    brand: {
      title: '清恒·青少年心理建构工具',
      subtitle: '欢迎来到你的专属心灵保养车间。按照 {step1} → {step2} → {step3} → {step4} 四个流程，为你的内心做一次点检与迭代。',
      welcomeMessage: '👋 欢迎回来，你的工具箱里已有 {n} 份方案。'
    },
    modules: {
      scan: { name:'扫描', title:'🔍 第一步 · 描述"故障现象"', desc:'最近哪个"零件"让你觉得不对劲？' },
      disassemble: { name:'拆解', title:'🔧 第二步 · 故障分型', desc:'把"故障现象"拆成信号、目的和强度。' },
      construct: { name:'建构', title:'🔨 第三步 · 制定保养方案', desc:'为自己设计一份可以在现实中启动的小方案。' },
      anchor: { name:'锚定', title:'⚓ 第四步 · 锚定与迭代', desc:'保养方案不是终点。这里是成长评审套件。' }
    },
    palette: {
      brand: '#2563eb',

  function debugLog(level, lines) {
    if (!state.debugEnabled) return;
    const flat = Array.isArray(lines) ? lines : [lines];
    flat.forEach(line => console.log(line));
    logBuffer.push({ lines: flat, time: Date.now() });
    if (logBuffer.length > MAX_LOG) logBuffer.shift();
    renderLogList();
  }

  function renderLogList() {
    const listDesktop = $('logListDesktop');
    const listMobile = $('logList');
    const list = listDesktop || listMobile;
    if (!list) return;
    if (logBuffer.length === 0) {
      list.innerHTML = '<div style="color:#64748b;text-align:center;padding:12px;">暂无日志</div>';
      return;
    }
    list.innerHTML = logBuffer.map(entry => {
      return '<div class="log-item">' + entry.lines.map(line => {
        let cls = '';
        if (line.startsWith('  ')) cls = 'log-indent1';
        else if (line.startsWith('    ')) cls = 'log-indent2';
        let content = line.trimStart();
        content = content.replace(/\[(.*?)\]/g, '<span class="log-module">[$1]</span>');
        content = content.replace(/→ (.*)/g, '→ <span class="log-action">$1</span>');
        content = content.replace(/⚠ (.*)/g, '⚠ <span class="log-highlight">$1</span>');
        content = content.replace(/🔴 (.*)/g, '🔴 <span class="log-highlight">$1</span>');
        content = content.replace(/: (.*)$/g, ': <span class="log-data">$1</span>');
        return '<div class="log-line '+cls+'">'+content+'</div>';
      }).join('')+'</div>';
    }).join('');
    list.scrollTop = list.scrollHeight;
  }

  class Scanner{
    constructor(){this.allowSingleChar=false;}
    scan(input){
      const logs=[];
      const text=input.trim();
      logs.push('[SCAN] 原始输入: "'+text+'"');
      if(!text)throw new Error('请输入描述');
      if(text.length<2)throw new Error('请多写一点');
      const metaphor=CONFIG.metaphors.find(m=>m.keys.some(k=>text.includes(k)))||null;
      if(metaphor)logs.push('[SCAN] 隐喻匹配: '+metaphor.keys[0]+' → '+metaphor.category);
      else logs.push('[SCAN] 隐喻匹配: 无');
      const matches=[];
      for(const[cat,words]of Object.entries(CONFIG.emotions)){
        for(const w of words){
          if(!this.allowSingleChar&&w.length===1)continue;
          if(text.includes(w)&&!matches.some(m=>m.word===w)){
            matches.push({word:w,category:cat});
            logs.push('  [SCAN] 匹配到情绪词: "'+w+'" → 类别: '+cat);
          }
        }
      }
      logs.push('[SCAN] 匹配总数: '+matches.length+' 个');
      if(!matches.length&&metaphor){matches.push({word:metaphor.keys[0],category:metaphor.category});logs.push('[SCAN] 兜底: 使用隐喻词填充');}
      logs.push('[SCAN] 否定词检测开始...');
      const toRemove=[];
      matches.forEach(m=>{
        const idx=text.indexOf(m.word);
        logs.push('  [NEGATE] 检查: "'+m.word+'" 位置: '+idx);
        if(idx>0){
          const prefix=text.substring(Math.max(0,idx-6),idx);
          logs.push('    前缀窗口(6字符): "'+prefix+'"');
          let negatorCount=0;
          const foundNegators=[];
          CONFIG.negators.forEach(n=>{let pos=-1;while((pos=prefix.indexOf(n,pos+1))!==-1){negatorCount++;foundNegators.push(n);}});
          logs.push('    前缀否定词数量: '+negatorCount+(foundNegators.length?' ('+foundNegators.join(', ')+')':''));
          if(negatorCount>=2){toRemove.push(m);logs.push('    🔴 双重否定 → 剔除 "'+m.word+'"');}
          else if(negatorCount===1){const negator=CONFIG.negators.find(n=>prefix.includes(n));m.negated=true;m.negator=negator;m.originalCategory=m.category;m.category='压抑/不适类';logs.push('    ⚠ 单重否定: "'+negator+'" → 类别改为: '+m.category);}
          else{logs.push('    无否定词 → 保持原类别');}
        }else{logs.push('    位置 <= 0，跳过否定检测');}
      });
      toRemove.forEach(m=>{const i=matches.indexOf(m);if(i!==-1)matches.splice(i,1);});
      const emotions=matches.map(m=>m.negated&&m.negator?m.negator+m.word:m.word).slice(0,4);
      logs.push('[SCAN] 最终情绪词: '+(emotions.length?emotions.join(', '):'无'));
      const categories=[...new Set(matches.map(m=>m.category))];
      logs.push('[SCAN] 类别: '+(categories.length?categories.join(', '):'无'));
      const primaryCategory=categories[0]||'复杂的情绪波动';
      logs.push('[SCAN] 主类别: '+primaryCategory);
      let output=emotions.length?'识别到情绪信号：'+emotions.join('、')+'。':'感受到一种复杂的情绪。';
      const event=CONFIG.events.find(e=>text.includes(e));
      if(event){output='触发事件可能和"'+event+'"有关。'+output;logs.push('[SCAN] 触发事件: '+event);}
      if(metaphor){output+='\n\n💬 '+metaphor.text;if(metaphor.q)output+='\n\n❓ '+metaphor.q;}
      else if(CONFIG.feelings[primaryCategory])output+='\n\n💬 '+CONFIG.feelings[primaryCategory];
      logs.push('[SCAN] 输出: '+output.replace(/\n/g,' '));
      debugLog('key', logs);
      return{output,match:{raw:text,event:event||null,emotions,emotion:emotions[0]||'复杂的情绪',categories,emotionCategory:primaryCategory,metaphor,intensity:null}};
    }
  }

  function setRoadmap(containerId,labels,currentStage,onJump){
    const container=$(containerId);if(!container)return;
    container.innerHTML='';
    labels.forEach(([icon,label],idx)=>{
      const stage=idx+1,cls=stage<currentStage?'done':(stage===currentStage?'current':'');
      const milestone=document.createElement('div');milestone.className='milestone '+cls;
      milestone.dataset.stage=stage;
      milestone.innerHTML='<span class="icon">'+icon+'</span><span class="label">'+label+'</span>';
      container.appendChild(milestone);
      if(idx<labels.length-1){const conn=document.createElement('div');conn.className='connector '+(stage<currentStage?'done':'');container.appendChild(conn);}
    });
    container.onclick=e=>{const milestone=e.target.closest('.milestone');if(!milestone)return;const s=Number(milestone.dataset.stage);if(s<=currentStage&&(milestone.classList.contains('done')||milestone.classList.contains('current')))onJump(s);};
  }

      '<button class="btn-primary" id="newMaintenanceBtn">🔄 开始新的保养</button></div>';
    show('creportArea',false);show('creportSuccess',true);
    const goAnchor=$('goAnchorBtn'); if(goAnchor) goAnchor.addEventListener('click',()=>{hideAll(['constructModule']);show('anchorModule',true);renderAnchor('museum');window.scrollTo(0,0);});
    const viewPlan=$('viewPlanBtn'); if(viewPlan) viewPlan.addEventListener('click',()=>{show('creportArea',true);$('creportArea').scrollIntoView({behavior:'smooth'});});
    const newMaint=$('newMaintenanceBtn'); if(newMaint) newMaint.addEventListener('click',()=>{if(confirm('确定重新开始吗？'))location.reload();});
  }

  function renderWelcomeCard(){
    const plans=readArr(STORE_KEYS.plans);if(!plans.length)return;
    const latest=plans[plans.length-1];
    const msg=CONFIG.brand.welcomeMessage.replace('{n}',plans.length).replace('{date}',new Date(latest.timestamp).toLocaleDateString('zh-CN'));
    const container=$('welcomeCardContainer');if(container){
      container.innerHTML='<div class="welcome-card"><div class="info"><strong>'+msg+'</strong></div><button class="btn-primary" id="welcomeEnterBtn">📂 进入工具箱</button></div>';
      const btn=$('welcomeEnterBtn');if(btn)btn.addEventListener('click',()=>{hideAll(['scanModule','disassembleModule','constructModule']);show('anchorModule',true);renderAnchor('museum');window.scrollTo(0,0);});
    }
  }

  function safeBind(selector, event, handler){
    const el = document.querySelector(selector);
    if(el) el.addEventListener(event, handler);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    try{
      $('mainTitle').textContent=CONFIG.brand.title;
      $('mainSubtitle').innerHTML=CONFIG.brand.subtitle.replace('{step1}',CONFIG.modules.scan.name).replace('{step2}',CONFIG.modules.disassemble.name).replace('{step3}',CONFIG.modules.construct.name).replace('{step4}',CONFIG.modules.anchor.name);
      $('scanTitle').textContent=CONFIG.modules.scan.title;$('scanDesc').innerHTML=CONFIG.modules.scan.desc;
      $('disTitle').textContent=CONFIG.modules.disassemble.title;$('disDesc').innerHTML=CONFIG.modules.disassemble.desc;
      $('conTitle').textContent=CONFIG.modules.construct.title;$('conDesc').innerHTML=CONFIG.modules.construct.desc;
      $('anchorTitle').textContent=CONFIG.modules.anchor.title;$('anchorDesc').innerHTML=CONFIG.modules.anchor.desc;
      $('userInput').placeholder=CONFIG.prompts.scan.inputPlaceholder;
    }catch(e){}
    renderWelcomeCard();

    // 初始化桌面端侧边栏
    initDesktopDebugSidebar();
    // 初始化移动端面板
    initMobileDebugPanel();

    safeBind('#scanBtn','click',runScan);safeBind('#confirmScanBtn','click',confirmScan);safeBind('#confirmReportBtn','click',confirmReport);safeBind('#savePlanBtn','click',savePlan);
    safeBind('#editPlanBtn','click',()=>{show('creportArea',false);show('cContent',true);renderConstruct();});
    safeBind('#copyPlanBtn','click',()=>{const t=$('creportEdit');if(t)navigator.clipboard.writeText(t.value||'');toast('已复制');});
    safeBind('#backToScanBtn','click',()=>{hideAll(['disassembleModule']);show('scanModule',true);show('scanConfirm',true);});
    safeBind('#resetDisBtn','click',()=>{state.d={name:'',body:'',time:'',place:'',reminder:'',memory:'',better:'',fact:'',feeling:'',tilt:'',friend:''};state.dStage=1;state.dSub=1;renderDisassemble();toast('已重置');});
    safeBind('#backToDisBtn','click',()=>{hideAll(['constructModule']);show('disassembleModule',true);show('reportArea',true);});
    safeBind('#resetConBtn','click',()=>{state.c={person:'',actionDone:'',felt:'',thought:'',perspective:'',newPerspective:'',trigger:'',action:'',firstStep:''};state.cStage=1;state.cSub=1;renderConstruct();toast('已重置');});
    document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>renderAnchor(t.dataset.tab));});
    debugLog('key',['[INIT] 框架已启动']);
    console.log('清恒·青少年心理建构工具 已就绪');
  });
})();
</script>
</body>
</html>
